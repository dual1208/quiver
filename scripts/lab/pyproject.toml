[project]
name = "quiver-lab"
version = "0.1.0"
description = "Typed physical-device lab orchestration for Quiver Native"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
quiver-lab = "quiver_lab.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
